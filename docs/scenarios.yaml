# 结构化场景清单（供 LLM 生成自动化用例）
#
# 约定：
# - path 省略公共前缀 /api/v1，实际请求为 {{base_url}} + path
# - expect.status 为期望 HTTP 状态码；expect.code 为响应体 code 字段（仅错误场景）
# - capture 表示从响应 JSON 中取值，键为变量名，值为响应字段（嵌套用 a.b）
# - {{xxx}} 为变量引用，由前序步骤 capture 或全局定义提供
# - 变量 stock_before 等需要先通过 GET /products/{id} 读取

version: 1
base_url: "{{BASE_URL}}"

auth:
  header: "Authorization: Bearer {{token}}"
  login_request:
    method: POST
    path: /auth/login
    json: { username: "{{username}}", password: "{{password}}" }
  login_capture:
    token: access_token

reset:
  method: POST
  path: /admin/reset
  note: "无鉴权；TEST_MODE=true 时返回 200，否则 404。建议每个场景执行前调用，保证可重复。"

conventions:
  money: "响应金额为字符串，两位小数；断言用字符串比较"
  time: "UTC ISO8601 带 +00:00；只断言非空或先后顺序"
  pagination: "page 从 1 开始，size 1-100；响应 {items,total,page,size}"
  ids: "不要硬编码订单/支付/购物车项 ID，从响应 capture"
  seed_ids: "种子商品 ID 固定 1-10，可硬编码"

seed_accounts:
  admin: { username: admin, password: admin123, is_admin: true }
  user: { username: testuser, password: "123456", is_admin: false }

seed_products:
  - { id: 1, name: "智能手机 Pro 12", price: "4999.00", stock: 100, status: ON_SALE }
  - { id: 2, name: "无线蓝牙耳机", price: "299.00", stock: 200, status: ON_SALE }
  - { id: 3, name: "机械键盘", price: "399.00", stock: 50, status: ON_SALE }
  - { id: 4, name: "纯棉T恤", price: "99.00", stock: 300, status: ON_SALE }
  - { id: 5, name: "轻薄羽绒服", price: "599.00", stock: 80, status: ON_SALE }
  - { id: 6, name: "运动跑鞋", price: "459.00", stock: 60, status: ON_SALE }
  - { id: 7, name: "每日坚果礼盒", price: "89.90", stock: 500, status: ON_SALE }
  - { id: 8, name: "精品挂耳咖啡", price: "59.00", stock: 1000, status: ON_SALE }
  - { id: 9, name: "限量版手机壳", price: "39.90", stock: 1, status: ON_SALE }
  - { id: 10, name: "临期清仓零食", price: "9.90", stock: 10, status: OFF_SALE }

scenarios:
  - id: SC-01
    title: "注册 → 登录 → 获取当前用户"
    priority: P0
    tags: [smoke, auth]
    preconditions: ["已执行 POST /admin/reset"]
    steps:
      - name: 注册新用户
        request:
          method: POST
          path: /auth/register
          json: { username: "{{unique_username}}", password: "123456" }
        expect: { status: 201, json: { username: "{{unique_username}}", is_admin: false } }
        capture: { user_id: id }
      - name: 重复注册
        request:
          method: POST
          path: /auth/register
          json: { username: "{{unique_username}}", password: "123456" }
        expect: { status: 409, code: USERNAME_TAKEN }
      - name: 错误密码登录
        request:
          method: POST
          path: /auth/login
          json: { username: "{{unique_username}}", password: "wrong-password" }
        expect: { status: 401, code: INVALID_CREDENTIALS }
      - name: 正确登录
        request:
          method: POST
          path: /auth/login
          json: { username: "{{unique_username}}", password: "123456" }
        expect: { status: 200, json: { token_type: bearer, expires_in: 7200 } }
        capture: { token: access_token }
      - name: 获取当前用户
        request:
          method: GET
          path: /auth/me
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { username: "{{unique_username}}" } }

  - id: SC-02
    title: "主链路：购物车 → 下单 → 支付 → 确认收货"
    priority: P0
    tags: [smoke, happy-path, order, payment]
    preconditions: ["reset", "testuser 登录，购物车为空"]
    steps:
      - name: 读取商品 1 初始库存
        request: { method: GET, path: /products/1 }
        expect: { status: 200, json: { status: ON_SALE } }
        capture: { stock_before: stock }
      - name: 加入购物车 2 件
        request:
          method: POST
          path: /cart/items
          headers: { Authorization: "Bearer {{token}}" }
          json: { product_id: 1, quantity: 2 }
        expect: { status: 200, json: { total_amount: "9998.00", total_quantity: 2 } }
        capture: { cart_item_id: items.0.id }
      - name: 修改为 3 件
        request:
          method: PATCH
          path: /cart/items/{{cart_item_id}}
          headers: { Authorization: "Bearer {{token}}" }
          json: { quantity: 3 }
        expect: { status: 200, json: { total_amount: "14997.00", total_quantity: 3 } }
      - name: 购物车结算下单
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            receiver_name: 张三
            receiver_phone: "13800000000"
            receiver_address: "北京市朝阳区示例路 1 号"
        expect:
          status: 201
          json:
            status: PENDING_PAYMENT
            total_amount: "14997.00"
        capture: { order_id: id }
      - name: 购物车已清空
        request:
          method: GET
          path: /cart
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { total_amount: "0.00", total_quantity: 0 } }
      - name: 下单即扣库存
        request: { method: GET, path: /products/1 }
        expect: { status: 200, stock_equals: "{{stock_before}} - 3" }
      - name: 支付成功
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: success }
        expect: { status: 200, json: { status: SUCCESS } }
        capture: { payment_no: payment_no }
      - name: 订单变为已支付
        request:
          method: GET
          path: /orders/{{order_id}}
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { status: PAID }, paid_at_not_null: true }
      - name: 确认收货
        request:
          method: POST
          path: /orders/{{order_id}}/confirm
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { status: COMPLETED } }
      - name: 按状态筛选订单
        request:
          method: GET
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          params: { status: COMPLETED, page: 1, size: 10 }
        expect: { status: 200, contains_order_id: "{{order_id}}" }
    assertions:
      - "订单 items[0].product_name == 智能手机 Pro 12"
      - "确认收货后 completed_at 非空"

  - id: SC-03
    title: "下单失败分支"
    priority: P1
    tags: [negative, order]
    preconditions: ["reset", "新注册用户登录，购物车为空"]
    steps:
      - name: 购物车为空下单
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json: { receiver_name: 张三, receiver_phone: "13800000000", receiver_address: 测试地址 }
        expect: { status: 400, code: CART_EMPTY }
      - name: 加购已下架商品
        request:
          method: POST
          path: /cart/items
          headers: { Authorization: "Bearer {{token}}" }
          json: { product_id: 10, quantity: 1 }
        expect: { status: 400, code: PRODUCT_NOT_AVAILABLE }
      - name: 库存不足
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 9, quantity: 2 }]
            receiver_name: 张三
            receiver_phone: "13800000000"
            receiver_address: 测试地址
        expect: { status: 409, code: OUT_OF_STOCK, detail: { stock: 1 } }
      - name: 数量为 0
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 1, quantity: 0 }]
            receiver_name: 张三
            receiver_phone: "13800000000"
            receiver_address: 测试地址
        expect: { status: 422, code: VALIDATION_ERROR }
      - name: items 为空数组
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: []
            receiver_name: 张三
            receiver_phone: "13800000000"
            receiver_address: 测试地址
        expect: { status: 422, code: VALIDATION_ERROR }
      - name: 未登录下单
        request:
          method: POST
          path: /orders
          json:
            receiver_name: 张三
            receiver_phone: "13800000000"
            receiver_address: 测试地址
        expect: { status: 401, code: UNAUTHORIZED }
      - name: 手机号格式非法
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json: { receiver_name: 张三, receiver_phone: abc, receiver_address: 测试地址 }
        expect: { status: 422, code: VALIDATION_ERROR }
      - name: 商品不存在
        request: { method: GET, path: /products/9999 }
        expect: { status: 404, code: PRODUCT_NOT_FOUND }

  - id: SC-04
    title: "支付失败 → 订单保持待支付 → 重试成功"
    priority: P0
    tags: [payment, negative, retry]
    preconditions: ["reset", "已登录"]
    steps:
      - name: 直接购买商品 2
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 2, quantity: 1 }]
            receiver_name: 李四
            receiver_phone: "13900000000"
            receiver_address: 测试地址
        expect: { status: 201, json: { status: PENDING_PAYMENT, total_amount: "299.00" } }
        capture: { order_id: id }
      - name: 模拟支付失败
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: failed }
        expect: { status: 200, json: { status: FAILED }, failure_reason_not_null: true }
      - name: 订单仍待支付
        request:
          method: GET
          path: /orders/{{order_id}}
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { status: PENDING_PAYMENT, paid_at: null } }
      - name: 支付尝试记录 1 条
        request:
          method: GET
          path: /orders/{{order_id}}/payments
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, list_length: 1, first_status: FAILED }
      - name: 重试支付成功
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: success }
        expect: { status: 200, json: { status: SUCCESS } }
      - name: 支付记录 2 条且升序
        request:
          method: GET
          path: /orders/{{order_id}}/payments
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, list_length: 2, statuses: [FAILED, SUCCESS] }

  - id: SC-05
    title: "已支付订单重复支付被拒"
    priority: P1
    tags: [payment, negative, idempotency]
    preconditions: ["reset", "已登录"]
    steps:
      - name: 下单并支付成功
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 6, quantity: 1 }]
            receiver_name: 王五
            receiver_phone: "13700000000"
            receiver_address: 测试地址
        expect: { status: 201 }
        capture: { order_id: id }
      - name: 支付成功
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: success }
        expect: { status: 200, json: { status: SUCCESS } }
      - name: 重复支付
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: success }
        expect: { status: 409, code: ALREADY_PAID }
      - name: 确认收货
        request:
          method: POST
          path: /orders/{{order_id}}/confirm
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { status: COMPLETED } }
      - name: 已完成订单再支付
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: success }
        expect: { status: 409, code: ALREADY_PAID }
      - name: 支付记录仍为 1 条
        request:
          method: GET
          path: /orders/{{order_id}}/payments
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, list_length: 1 }

  - id: SC-06
    title: "取消待支付订单 → 回补库存 → 支付被拒"
    priority: P0
    tags: [order, inventory]
    preconditions: ["reset", "已登录"]
    steps:
      - name: 读取商品 3 库存
        request: { method: GET, path: /products/3 }
        capture: { stock_before: stock }
      - name: 下单 2 件
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 3, quantity: 2 }]
            receiver_name: 赵六
            receiver_phone: "13600000000"
            receiver_address: 测试地址
        expect: { status: 201 }
        capture: { order_id: id }
      - name: 库存已扣减
        request: { method: GET, path: /products/3 }
        expect: { stock_equals: "{{stock_before}} - 2" }
      - name: 取消订单
        request:
          method: POST
          path: /orders/{{order_id}}/cancel
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { status: CANCELLED }, cancelled_at_not_null: true }
      - name: 库存已回补
        request: { method: GET, path: /products/3 }
        expect: { stock_equals: "{{stock_before}}" }
      - name: 取消后支付
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: success }
        expect: { status: 409, code: ORDER_INVALID_STATE }
      - name: 重复取消
        request:
          method: POST
          path: /orders/{{order_id}}/cancel
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 409, code: ORDER_INVALID_STATE }

  - id: SC-07
    title: "退款 → 回补库存 → 重复退款被拒"
    priority: P0
    tags: [refund, inventory]
    preconditions: ["reset", "已登录"]
    steps:
      - name: 读取商品 2 库存
        request: { method: GET, path: /products/2 }
        capture: { stock_before: stock }
      - name: 下单 2 件并支付
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 2, quantity: 2 }]
            receiver_name: 钱七
            receiver_phone: "13500000000"
            receiver_address: 测试地址
        expect: { status: 201 }
        capture: { order_id: id, order_amount: total_amount }
      - name: 支付成功
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: success }
        expect: { status: 200, json: { status: SUCCESS } }
      - name: 退款
        request:
          method: POST
          path: /orders/{{order_id}}/refund
          headers: { Authorization: "Bearer {{token}}" }
          json: { reason: 不想要了 }
        expect: { status: 200, json: { status: SUCCESS, amount: "{{order_amount}}" } }
      - name: 订单已退款
        request:
          method: GET
          path: /orders/{{order_id}}
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { status: REFUNDED } }
      - name: 库存已回补
        request: { method: GET, path: /products/2 }
        expect: { stock_equals: "{{stock_before}}" }
      - name: 重复退款
        request:
          method: POST
          path: /orders/{{order_id}}/refund
          headers: { Authorization: "Bearer {{token}}" }
          json: { reason: 再退一次 }
        expect: { status: 409, code: ORDER_INVALID_STATE }
      - name: 退款后支付
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: success }
        expect: { status: 409, code: ORDER_INVALID_STATE }
    extra_cases:
      - title: "已完成订单不可退款"
        steps:
          - "下单 → 支付 → 确认收货 → 退款"
          - "expect: 409 ORDER_INVALID_STATE"

  - id: SC-08
    title: "越权访问他人资源"
    priority: P1
    tags: [security, isolation]
    preconditions: ["reset", "用户 A 已下单", "用户 B 已注册登录"]
    steps:
      - name: 用户 A 下单并加购
        note: "A 的 token 见 {{token_a}}"
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token_a}}" }
          json:
            items: [{ product_id: 4, quantity: 1 }]
            receiver_name: 用户A
            receiver_phone: "13400000000"
            receiver_address: 测试地址
        expect: { status: 201 }
        capture: { order_a: id }
      - name: 用户 A 加购
        request:
          method: POST
          path: /cart/items
          headers: { Authorization: "Bearer {{token_a}}" }
          json: { product_id: 4, quantity: 1 }
        expect: { status: 200 }
        capture: { cart_item_a: items.0.id }
      - name: B 查 A 的订单
        request:
          method: GET
          path: /orders/{{order_a}}
          headers: { Authorization: "Bearer {{token_b}}" }
        expect: { status: 404, code: ORDER_NOT_FOUND }
      - name: B 支付 A 的订单
        request:
          method: POST
          path: /orders/{{order_a}}/pay
          headers: { Authorization: "Bearer {{token_b}}" }
          json: { mock_result: success }
        expect: { status: 404, code: ORDER_NOT_FOUND }
      - name: B 的订单列表为空
        request:
          method: GET
          path: /orders
          headers: { Authorization: "Bearer {{token_b}}" }
        expect: { status: 200, json: { total: 0 } }
      - name: B 修改 A 的购物车项
        request:
          method: PATCH
          path: /cart/items/{{cart_item_a}}
          headers: { Authorization: "Bearer {{token_b}}" }
          json: { quantity: 5 }
        expect: { status: 404, code: CART_ITEM_NOT_FOUND }

  - id: SC-09
    title: "并发下单不超卖"
    priority: P1
    tags: [concurrency, inventory, mysql-only]
    preconditions:
      - "reset 后商品 9 库存为 1"
      - "创建 N=8 个独立用户并各自登录"
      - "仅适用于 MySQL；SQLite 无行锁语义"
    steps:
      - name: 并发下单
        action: "8 个线程同时 POST /orders，每个用户 items=[{product_id: 9, quantity: 1}]"
        expect: "恰好 1 个 201，其余全部 409 OUT_OF_STOCK"
      - name: 库存归零
        request: { method: GET, path: /products/9 }
        expect: { status: 200, json: { stock: 0 } }
      - name: 总扣减量为 1
        action: "查询所有成功订单的 items 数量之和"
        expect: 1

  - id: SC-10
    title: "管理员改价不影响历史订单（快照）"
    priority: P1
    tags: [snapshot, admin]
    preconditions: ["reset", "普通用户与 admin 均已登录"]
    steps:
      - name: 商品 4 原价 99.00
        request: { method: GET, path: /products/4 }
        expect: { status: 200, json: { price: "99.00" } }
      - name: 下单 2 件
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 4, quantity: 2 }]
            receiver_name: 孙八
            receiver_phone: "13300000000"
            receiver_address: 测试地址
        expect: { status: 201, json: { total_amount: "198.00" } }
        capture: { order_id: id }
      - name: 管理员改价为 109.00
        request:
          method: PATCH
          path: /admin/products/4
          headers: { Authorization: "Bearer {{admin_token}}" }
          json: { price: "109.00" }
        expect: { status: 200, json: { price: "109.00" } }
      - name: 历史订单金额不变
        request:
          method: GET
          path: /orders/{{order_id}}
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { total_amount: "198.00" } }
      - name: 新订单按新价
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 4, quantity: 2 }]
            receiver_name: 孙八
            receiver_phone: "13300000000"
            receiver_address: 测试地址
        expect: { status: 201, json: { total_amount: "218.00" } }

  - id: SC-11
    title: "购物车内商品下架后结算被拒"
    priority: P1
    tags: [cart, catalog, admin]
    preconditions: ["reset", "普通用户与 admin 均已登录"]
    steps:
      - name: 加购商品 5
        request:
          method: POST
          path: /cart/items
          headers: { Authorization: "Bearer {{token}}" }
          json: { product_id: 5, quantity: 1 }
        expect: { status: 200, json: { items: [{ available: true }] } }
      - name: 管理员下架商品 5
        request:
          method: PATCH
          path: /admin/products/5
          headers: { Authorization: "Bearer {{admin_token}}" }
          json: { status: OFF_SALE }
        expect: { status: 200, json: { status: OFF_SALE } }
      - name: 购物车项不可用
        request:
          method: GET
          path: /cart
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { items: [{ available: false, product_status: OFF_SALE }] } }
      - name: 结算被拒
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json: { receiver_name: 周九, receiver_phone: "13200000000", receiver_address: 测试地址 }
        expect: { status: 400, code: PRODUCT_NOT_AVAILABLE }
      - name: 购物车未被清空
        request:
          method: GET
          path: /cart
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, list_length: 1 }
      - name: 恢复上架后可下单
        request:
          method: PATCH
          path: /admin/products/5
          headers: { Authorization: "Bearer {{admin_token}}" }
          json: { status: ON_SALE }
        expect: { status: 200 }
      - name: 再次结算
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json: { receiver_name: 周九, receiver_phone: "13200000000", receiver_address: 测试地址 }
        expect: { status: 201 }

  - id: SC-12
    title: "异步回调重复通知只生效一次"
    priority: P1
    tags: [payment, idempotency, callback]
    preconditions: ["reset", "已登录"]
    steps:
      - name: 下单商品 2
        request:
          method: POST
          path: /orders
          headers: { Authorization: "Bearer {{token}}" }
          json:
            items: [{ product_id: 2, quantity: 1 }]
            receiver_name: 吴十
            receiver_phone: "13100000000"
            receiver_address: 测试地址
        expect: { status: 201 }
        capture: { order_id: id }
      - name: 先支付失败
        request:
          method: POST
          path: /orders/{{order_id}}/pay
          headers: { Authorization: "Bearer {{token}}" }
          json: { mock_result: failed }
        expect: { status: 200, json: { status: FAILED } }
        capture: { payment_no: payment_no }
      - name: 回调成功
        request:
          method: POST
          path: /payments/{{payment_no}}/notify
          json: { mock_result: success }
        expect: { status: 200, json: { status: SUCCESS, payment_no: "{{payment_no}}" } }
        capture: { paid_at_first: paid_at }
      - name: 订单变为已支付
        request:
          method: GET
          path: /orders/{{order_id}}
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, json: { status: PAID } }
      - name: 重复回调
        request:
          method: POST
          path: /payments/{{payment_no}}/notify
          json: { mock_result: success }
        expect: { status: 200, json: { paid_at: "{{paid_at_first}}" } }
      - name: 未新增支付记录
        request:
          method: GET
          path: /orders/{{order_id}}/payments
          headers: { Authorization: "Bearer {{token}}" }
        expect: { status: 200, list_length: 1 }
      - name: 不存在的支付单号
        request:
          method: POST
          path: /payments/NOT-EXIST/notify
          json: { mock_result: success }
        expect: { status: 404, code: PAYMENT_NOT_FOUND }
