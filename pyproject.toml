[project]
name = "auto-test-demo-sys"
version = "0.1.0"
description = "可被自动化接口测试驱动的电商 demo 后端（FastAPI + MySQL）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "bcrypt>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 这是应用仓库而非可安装库，uv 只安装依赖
[tool.uv]
package = false
